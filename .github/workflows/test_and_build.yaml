name: Prueba CI CD

on:
  push:
    branches: [ "Alejandro" ]

jobs:
  tryCiCd:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.11.0]
 
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
